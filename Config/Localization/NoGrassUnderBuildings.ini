[CommonSettings]
SourcePath=Mods/NoGrassUnderBuildings/Content/Localization/NoGrassUnderBuildings
DestinationPath=Mods/NoGrassUnderBuildings/Content/Localization/NoGrassUnderBuildings
ManifestName=NoGrassUnderBuildings.manifest
ArchiveName=NoGrassUnderBuildings.archive
PortableObjectName=NoGrassUnderBuildings.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=fr
CulturesToGenerate=es
CulturesToGenerate=pt-BR
CulturesToGenerate=pl
CulturesToGenerate=ru
CulturesToGenerate=zh-Hans
CulturesToGenerate=ja
CulturesToGenerate=ko

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Mods/NoGrassUnderBuildings/Source
FileNameFilters=*.h
FileNameFilters=*.cpp

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
SkipGatherCache=true
IncludePathFilters=Mods/NoGrassUnderBuildings/Content/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
ResourceName=NoGrassUnderBuildings.locres

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=NoGrassUnderBuildings.csv
bConflictReport=true
ConflictReportName=NoGrassUnderBuildingsConflicts.txt
